<script>
  // Apply reduced-motion preference as early as possible so initial paint matches the
  // user's choice. Animations are ON by default: only the explicit Settings toggle
  // (localStorage 'landsurv_reduced_motion' === 'true') disables them. OS-level
  // prefers-reduced-motion is intentionally ignored so animations don't silently
  // get turned off for users who never asked for it inside LandSurv.
  try {
    if (localStorage.getItem('landsurv_reduced_motion') === 'true') {
      document.documentElement.setAttribute('data-reduced-motion', 'true');
    }
  } catch (e) { /* ignore */ }
</script>
<style>
  /* Reduce-motion override: kills all infinite/looping animations app-wide.
     Driven solely by html[data-reduced-motion="true"], which the early-paint
     script above sets from the explicit Settings toggle (with OS prefers-reduced-motion
     as a fallback only when the user has not made an explicit choice). */
  html[data-reduced-motion="true"] *,
  html[data-reduced-motion="true"] *::before,
  html[data-reduced-motion="true"] *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }

  /* Default to normal document scrolling. Interactive viewports opt into lock mode. */
  html, body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    overflow-x: hidden;
  }
  body {
    min-height: 100dvh;
    overflow-y: auto;
  }
  #root {
    width: 100%;
    min-height: 100dvh;
  }
  /* Scene-graph (canvas) lock: fill EXACTLY the visible viewport so pinch-zoom
     and pan are captured by the canvas instead of scrolling/zooming the page.
     Using --app-height (visualViewport height) — not height:100%, which on
     mobile resolves to the larger toolbar-hidden viewport and left a gap at the
     bottom of the screen. 100dvh is the no-JS fallback. */
  html[data-landsurv-scroll-locked="true"],
  body[data-landsurv-scroll-locked="true"] {
    height: var(--app-height, 100dvh);
    overflow: hidden;
    overscroll-behavior: none;
  }
  #root[data-landsurv-scroll-locked="true"] {
    height: var(--app-height, 100dvh);
